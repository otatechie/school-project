[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/run/supervisord.pid
loglevel=info

; If either program cannot start, supervisor should stop rather than restart in
; a loop forever — a container that exits is visible in Dokploy, whereas one
; that restarts silently looks healthy while serving nothing.
[eventlistener:exit_on_fatal]
command=sh -c 'printf "READY\n"; while read line; do echo "A program entered FATAL state; stopping." >&2; kill -SIGQUIT $PPID; printf "RESULT 2\nOK"; done'
events=PROCESS_STATE_FATAL

[program:php-fpm]
command=php-fpm --nodaemonize
autostart=true
autorestart=true
startretries=3
priority=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
